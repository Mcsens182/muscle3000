/* ================= 1.14 : SÉANCE « UNE SÉRIE À LA FOIS » =================
   Vue par défaut en séance : la série en cours en très gros, un énorme bouton Valider, le repos en plein écran.
   La liste complète (l'ancienne vue) reste accessible d'un tap ; le choix est gardé dans S.settings.exView. */
function exView(){ return S.settings.exView === 'list' ? 'list' : 'focus'; }
function fxSetLabel(ex, j){
  var s = ex.sets[j]; if(!s) return '';
  if(s.warm){ var w = 0, wn = 0; ex.sets.forEach(function(x, i){ if(x.warm){ wn++; if(i <= j) w++; } }); return L('ÉCHAUFFEMENT ', 'WARM-UP ') + w + ' / ' + wn; }
  var k = workIndex(ex, j) + 1, n = ex.sets.filter(function(x){ return !x.warm; }).length;
  return L('SÉRIE ', 'SET ') + k + L(' SUR ', ' OF ') + n + ' · ' + L('CIBLE ', 'TARGET ') + s.lo + (s.hi !== s.lo ? '–' + s.hi : '');
}
function fxLast(ex, j){
  var pl = pastEntries(ex.name)[0], s = ex.sets[j]; if(!pl || !s) return null;
  if(s.warm) return pl.all.filter(function(x){ return x.warm; })[ex.sets.slice(0, j).filter(function(x){ return x.warm; }).length] || null;
  return pl.sets[workIndex(ex, j)] || null;
}
/* la dernière séance de l'exercice, série par série : ce qu'il faut battre aujourd'hui */
function fxPrev(ex, sj){
  var pl = pastEntries(ex.name)[0], s = sj != null ? ex.sets[sj] : null, cur = s && !s.warm ? workIndex(ex, sj) : 0;
  if(!pl || !pl.sets.length) return '<div class="fx-prev empty"><span>' + L('PREMIÈRE FOIS SUR CET EXERCICE', 'FIRST TIME ON THIS EXERCISE') + '</span></div>';
  var x = pl.sets[cur], lab = (s && s.warm ? L('1RE SÉRIE', 'SET 1') : L('SÉRIE ', 'SET ') + (cur + 1)) + L(' · SÉANCE DU ', ' · SESSION ON ') + fmtDate(pl.date);
  if(!x) return '<div class="fx-prev empty"><span>' + L('À BATTRE · ', 'TO BEAT · ') + lab + '</span><div>' + L('Pas de série ', 'No set ') + (cur + 1) + L(' la dernière fois : tout est bonus', ' last time: it\'s all bonus') + '</div></div>';
  return '<div class="fx-prev"><span>' + L('À BATTRE · ', 'TO BEAT · ') + lab + '</span><div><b class="now">' + fmtS(ex.name, x.w, x.r) + '</b></div></div>';
}
function fxDots(ex, sj){
  return '<div class="fx-dots">' + ex.sets.map(function(s, j){
    var c = (s.done ? 'done' : j === sj ? 'now' : '') + (s.warm ? ' warm' : '') + (s.redo ? ' redo' : '');
    return s.done ? '<button class="' + c + '" data-a="reopen" data-j="' + j + '" aria-label="' + L('Corriger la série ', 'Fix set ') + (j + 1) + '"></button>' : '<i class="' + c + '" aria-hidden="true"></i>';
  }).join('') + '</div>';
}
function fxHead(a, i, n){
  var doneSets = 0, totalSets = 0; a.exercises.forEach(function(e){ e.sets.forEach(function(s){ if(!s.warm){ totalSets++; if(s.done) doneSets++; } }); });
  return '<header class="fx-head"><button data-a="scr" data-s="ov">← ' + esc(trText(a.name)) + '</button><span>' + L('EXO ', 'EX ') + (i + 1) + ' / ' + n + ' · ' + L('FIN ', 'END ') + etaTxt(a) + '</span><b id="clock">● ' + mmss((Date.now() - a.start) / 1000) + '</b></header><div class="m3-progress fx-prog"><i style="width:' + Math.round(doneSets / Math.max(1, totalSets) * 100) + '%"></i></div>';
}
function fxNextTxt(a, ex, sj){
  var pi = ssPartner(a.idx), cs = sj != null ? ex.sets[sj] : null;
  if(pi != null && cs && !cs.warm && hasWork(a.exercises[pi])) return exDisp(a.exercises[pi].name) + ' (superset)';
  for(var j = (sj == null ? ex.sets.length : sj + 1); j < ex.sets.length; j++) if(!ex.sets[j].done) return fxSetLabel(ex, j).split(' · ')[0].toLowerCase();
  var ne = a.exercises[a.idx + 1]; return ne ? exDisp(ne.name) : L('fin de séance', 'end of session');
}
function fxFixRow(k, label, val){
  return '<div class="fx-fix-row"><button data-a="fx' + k + '" data-d="-1" aria-label="' + L('Moins', 'Less') + '">−</button><div><small>' + label + '</small><b>' + val + '</b></div><button data-a="fx' + k + '" data-d="1" aria-label="' + L('Plus', 'More') + '">+</button></div>';
}
function vFocus(){
  var a = S.active, ex = cur(), i = a.idx, n = a.exercises.length, sj = selIndex(ex), ri = restInfo(), xt = exType(ex.name);
  var h = fxHead(a, i, n);
  /* repos en plein écran tant qu'il n'est pas fini ; à zéro, render() repasse ici et la série suivante s'affiche */
  if(ri && !ri.over){
    var rex = a.exercises[ri.r.ex] || ex, rs = rex.sets[ri.r.set], rt = exType(rex.name), nj = selIndex(ex), ns = nj != null ? ex.sets[nj] : null;
    var nw = ns ? (ns.w != null ? ns.w : ns.sw) : null, circ = 854.5;
    h += '<section class="fx-rest" id="rest-band">';
    /* la série qu'on vient de valider se corrige ici, sans arrêter le repos */
    if(ui.fixLast && rs){
      h += '<div class="fx-fix"><span>' + fxSetLabel(rex, ri.r.set).split(' · ')[0] + ' · ' + esc(exDisp(rex.name)).toUpperCase() + '</span>';
      h += fxFixRow('w', wLab(rex.name), kg(rs.w || 0) + ' kg') + fxFixRow('r', rt === 'time' ? L('DURÉE', 'TIME') : 'REPS', rs.r + (rt === 'time' ? ' s' : ''));
      h += '<button class="fx-fix-ok" data-a="fixok">' + L('C\'est corrigé', 'Done') + '</button></div>';
    } else {
      h += '<button class="fx-rest-done" data-a="fixlast"><i aria-hidden="true">✓</i><span>' + (rs ? fxSetLabel(rex, ri.r.set).split(' · ')[0] + L(' validée · ', ' logged · ') + '<b>' + fmtS(rex.name, rs.w, rs.r) + '</b>' : L('Série validée', 'Set logged')) + '</span><em>' + L('Corriger', 'Fix') + '</em></button>';
    }
    h += '<div class="fx-ring"><svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="136" class="fx-ring-bg"/><circle cx="150" cy="150" r="136" class="fx-ring-fg" id="t-ring" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * ri.pct / 100).toFixed(1) + '" transform="rotate(-90 150 150)"/></svg><div><strong id="t-big">' + mmss(ri.left) + '</strong><small>' + L('sur ', 'of ') + mmss(ri.r.total) + '</small></div></div>';
    h += '<div class="fx-rest-adj"><button data-a="tadj" data-d="-15">−15 s</button><button data-a="tadj" data-d="15">+15 s</button></div>';
    var sup = ri.r.label === 'SUPERSET' ? L('SUPERSET · ', 'SUPERSET · ') : '';
    h += '<div class="fx-rest-next"><div><span>' + L('ENSUITE · ', 'NEXT · ') + sup + (ns ? fxSetLabel(ex, nj).split(' · ')[0] + (a.idx !== ri.r.ex ? ' · ' + esc(exDisp(ex.name)).toUpperCase() : '') : L('FIN DE L\'EXERCICE', 'END OF EXERCISE')) + '</span><b>' + (ns ? tgtTxt(ex.name, nw, ns.lo, ns.hi) : esc(fxNextTxt(a, ex, null))) + '</b>' + (function(){ var lx = ns ? fxLast(ex, nj) : null; return lx ? '<small class="fx-rest-prev">' + L('Dernière fois : ', 'Last time: ') + fmtS(ex.name, lx.w, lx.r) + '</small>' : ''; })() + '</div><button data-a="skip">' + L('PASSER', 'SKIP') + ' →</button></div>';
    h += '<p class="fx-rest-tip">' + L('À zéro : un petit son, puis la série suivante s\'ouvre seule. Touche la série validée pour la corriger.', 'At zero: a short sound, then the next set opens by itself. Tap the logged set to fix it.') + '</p></section>';
    return h;
  }
  ui.fixLast = false;
  if(sj == null){
    var ne = a.exercises[i + 1];
    h += '<section class="fx-end"><span class="m3-eyebrow">' + L('EXERCICE TERMINÉ', 'EXERCISE DONE') + '</span><h1>' + esc(exDisp(ex.name)) + '</h1><p>' + ex.sets.filter(function(s){ return s.done && !s.warm; }).map(function(s){ return fmtS(ex.name, s.w, s.r); }).join(' · ') + '</p>';
    h += fxDots(ex, null);
    h += ne ? '<button class="fx-validate" data-a="nav" data-d="1">' + esc(exDisp(ne.name)).toUpperCase() + ' <span aria-hidden="true">→</span></button>' : (freeSession() ? '<button class="fx-validate" data-a="nav" data-d="1">' + L('AJOUTER UN EXERCICE', 'ADD AN EXERCISE') + '</button>' : '<button class="fx-validate" data-a="askfinish">' + L('TERMINER LA SÉANCE', 'FINISH SESSION') + ' <span aria-hidden="true">✓</span></button>');
    h += '<button class="fx-alt" data-a="addset">' + L('+ Une série de plus', '+ One more set') + '</button>';
    h += '<p class="fx-cue">' + L('Une erreur ? Touche une barre ci-dessus pour corriger la série.', 'A mistake? Tap a bar above to fix that set.') + '</p></section>';
    if(ui.confirm === 'finish') h += '<div class="m3s-list fx-confirm">' + m3sConfirm(L('Terminer et enregistrer la séance ?', 'Finish and save the session?'), 'finish', L('Terminer', 'Finish')) + '</div>';
    return h + fxFoot(a, ex, sj);
  }
  var s = ex.sets[sj], last = fxLast(ex, sj), wv = s.w != null ? s.w : s.sw, pi = ssPartner(i);
  var hint = s.w == null && s.sw != null && s.trend ? ({'▲':L('+' + kg(inc()) + ' kg proposé', '+' + kg(inc()) + ' kg suggested'), '+1':(xt === 'time' ? L('+5 s proposées', '+5 s suggested') : L('+1 rep proposée', '+1 rep suggested')), '▼':L('charge allégée', 'lighter weight'), '=':L('même charge', 'same weight')})[s.trend] || '' : (s.w == null && s.sw != null ? L('proposé', 'suggested') : '');
  var eye = (s.redo ? L('CORRECTION · ', 'FIXING · ') : '') + (pi != null ? 'SUPERSET ' + (pi > i ? 'A' : 'B') + ' · ' : '') + fxSetLabel(ex, sj) + (xt === 'time' ? ' s' : '');
  h += '<div class="fx-title"><div><span class="m3-eyebrow fx-eye">' + eye + '</span><h1>' + esc(exDisp(ex.name)) + '</h1></div><div class="fx-tbtns"><button class="fx-info" data-a="repl" aria-label="' + L('Remplacer l\'exercice', 'Replace the exercise') + '">⇄</button><button class="fx-info" data-a="fiche" data-n="' + esc(ex.name) + '" aria-label="' + L('Ouvrir la fiche', 'Open the info') + '">i</button></div></div>';
  h += '<input class="fx-note fx-note-top" data-f="note" value="' + esc(ex.note || '') + '" placeholder="' + L('+ Ajouter une note', '+ Add a note') + '" aria-label="' + L('Note sur l\'exercice', 'Exercise note') + '" autocomplete="off">';
  h += fxDots(ex, sj) + fxPrev(ex, sj);
  if(ri && ri.over) h += '<div class="fx-over">' + L('Repos terminé · ', 'Rest done · ') + '<b id="t-over">+' + mmss(-ri.left) + '</b></div>';
  h += '<section class="fx-card">';
  h += '<div class="fx-row"><button class="fx-pm" data-a="w" data-d="-1" aria-label="' + L('Moins ', 'Minus ') + kg(inc()) + ' kg">−</button><label class="fx-val"><span>' + wLab(ex.name) + '</span><input id="in-w" data-f="w" readonly data-pad="w" inputmode="none" value="' + (s.w != null ? kg(s.w) : '') + '" placeholder="' + (s.sw != null ? kg(s.sw) : xt !== 'w' ? '0' : '—') + '" class="' + (s.w == null ? 'sug' : '') + '"><small class="' + (hint ? 'hint' : '') + '">' + (hint || 'kg') + '</small></label><button class="fx-pm" data-a="w" data-d="1" aria-label="' + L('Plus ', 'Plus ') + kg(inc()) + ' kg">+</button></div>';
  h += '<div class="fx-sep"></div>';
  h += '<div class="fx-row"><button class="fx-pm" data-a="r" data-d="-1" aria-label="' + (xt === 'time' ? L('5 secondes de moins', '5 seconds less') : L('Une rep de moins', 'One rep less')) + '">−</button><label class="fx-val"><span>' + rLab(ex.name) + '</span><input id="in-r" data-f="r" readonly data-pad="r" inputmode="none" value="' + (s.r != null ? s.r : '') + '" placeholder="' + (s.sr != null ? s.sr : '—') + '" class="' + (s.r == null ? 'sug' : '') + '"><small>' + (xt === 'time' ? L('secondes', 'seconds') : 'reps') + '</small></label><button class="fx-pm" data-a="r" data-d="1" aria-label="' + (xt === 'time' ? L('5 secondes de plus', '5 seconds more') : L('Une rep de plus', 'One rep more')) + '">+</button></div>';
  h += '</section>';
  if(xt === 'w' && barOn(ex.name) && wv) h += '<p class="fx-plates">' + platesTxt(ex.name, wv) + '</p>';
  if(last) h += '<button class="fx-last" data-a="uselast">' + L('La dernière fois : ', 'Last time: ') + '<b>' + fmtS(ex.name, last.w, last.r) + '</b> · ' + L('reprendre', 'reuse') + '</button>';
  if(ex.cue) h += '<p class="fx-cue">' + esc(trText(ex.cue)) + '</p>';
  h += '<button class="fx-validate" data-a="validate">' + (s.redo ? L('ENREGISTRER', 'SAVE') : L('VALIDER', 'LOG SET')) + ' <span aria-hidden="true">✓</span></button>';
  if(xt === 'w' && !s.warm && !ex.sets.some(function(x){ return x.warm || x.done; })) h += '<button class="fx-alt fx-warm" data-a="autowarm">⚡ ' + L('Ajouter un échauffement auto', 'Add an automatic warm-up') + '</button>';
  return h + fxFoot(a, ex, sj);
}
function fxFoot(a, ex, sj){
  return '<button class="fx-foot" data-a="exview" data-v="list"><i aria-hidden="true"></i>' + L('Ensuite : ', 'Next: ') + esc(fxNextTxt(a, ex, sj)) + ' · ' + L('toutes les séries', 'all sets') + '</button>';
}
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a="exview"]'); if(!el) return;
  S.settings.exView = el.getAttribute('data-v') === 'list' ? 'list' : 'focus'; save(); window.scrollTo(0, 0); render();
});
/* l'anneau du repos suit le temps, sans tout redessiner */
setInterval(function(){
  var r = document.getElementById('t-ring'); if(!r) return;
  var ri = restInfo(); if(ri) r.setAttribute('stroke-dashoffset', (854.5 * ri.pct / 100).toFixed(1));
}, 250);

/* ================= 1.15 : SAISIE, JOURNAL, SUPERSETS, POIDS DU CORPS =================
   Tout ce bloc s'ajoute au moteur existant : le modèle de données ne change pas, il gagne seulement
   quelques champs optionnels (type d'exercice, superset, échauffement auto, série corrigée). */
function m3map(k){ if(!S.settings[k] || typeof S.settings[k] !== 'object') S.settings[k] = {}; return S.settings[k]; }
function pad2(n){ return ('0' + n).slice(-2); }
function hm(t){ var d = new Date(t); return isEN() ? d.getHours() + ':' + pad2(d.getMinutes()) : d.getHours() + 'h' + pad2(d.getMinutes()); }

/* ---------- type d'exercice : charge, poids du corps (lest optionnel), durée ---------- */
var BW_RX = /^(pompes|tractions|dips|chin|pull.?up|push.?up|muscle.?up|burpee|crunch|relev|abdo|mountain|squat saute|fentes sautees|hollow|v.?up|toes|australian|rowing inverse|traction australienne)/;
var TIME_RX = /(gainage|planche abdo|plank|chaise murale|wall sit|dead hang|suspension|hollow hold|l.?sit)/;
function exType(name){
  var t = m3map('exType')[fold(name)]; if(t === 'w' || t === 'bw' || t === 'time') return t;
  var n = fold(name);
  if(/lest|weighted/.test(n)) return 'w';
  if(TIME_RX.test(n)) return 'time';
  if(BW_RX.test(n)) return 'bw';
  return 'w';
}
/* valeur qui sert aux records et à la progression : 1RM estimé pour la charge, sinon lest d'abord puis reps (ou secondes) */
function score(name, w, r){
  if(!r) return 0;
  return exType(name) === 'w' ? e1rm(w, r) : (w || 0) * 1000 + r;
}
function fmtS(name, w, r){
  var t = exType(name), rr = r == null ? '—' : r;
  if(t === 'w') return kg(w) + '×' + rr;
  if(t === 'time') return (w ? '+' + kg(w) + ' kg · ' : '') + rr + ' s';
  return w ? '+' + kg(w) + '×' + rr : rr + ' reps';
}
function tgtTxt(name, w, lo, hi){
  var t = exType(name), rg = lo + (hi !== lo ? '–' + hi : '');
  if(t === 'w') return (w != null ? kg(w) + ' kg × ' : '') + rg;
  return (w ? '+' + kg(w) + ' kg · ' : '') + rg + (t === 'time' ? ' s' : ' reps');
}
function wLab(name){ return exType(name) === 'w' ? L('CHARGE', 'WEIGHT') : L('LEST', 'EXTRA'); }
function rLab(name){ return exType(name) === 'time' ? L('DURÉE', 'TIME') : L('RÉPÉTITIONS', 'REPS'); }

/* ---------- barre et disques ---------- */
function barW(){ return S.settings.barW || 20; }
function barOn(name){
  var v = m3map('exBar')[fold(name)]; if(typeof v === 'boolean') return v;
  var n = fold(name);
  if(exType(name) !== 'w' || /halt|machine|poulie|smith|kettle|cable|guide|presse|bulgare|goblet|hack|landmine|elastique/.test(n)) return false;
  return /barre|squat|souleve|deadlift|developpe couche|developpe incline|developpe militaire|overhead press|military|hip thrust|good morning|bench press|front squat/.test(n);
}
function platesTxt(name, W){
  if(!W || !barOn(name)) return '';
  var bar = barW();
  if(W < bar) return L('Moins que la barre seule (', 'Less than the empty bar (') + bar + ' kg)';
  if(Math.abs(W - bar) < .01) return L('Barre seule · ', 'Empty bar · ') + bar + ' kg';
  var side = (W - bar) / 2, out = [];
  [20, 10, 5, 2.5, 1.25].forEach(function(p){ while(side >= p - 1e-6){ out.push(p); side -= p; } });
  return L('Par côté : ', 'Per side: ') + out.map(kg).join(' + ') + (side > .01 ? ' (≈)' : '') + L(' · barre ', ' · bar ') + bar + ' kg';
}

/* ---------- échauffement automatique ---------- */
function autoWarmOn(name){ return !!m3map('autoWarm')[fold(name)]; }
function genWarm(ex, silent){
  if(exType(ex.name) !== 'w'){ if(!silent) toast(L('L\'échauffement auto sert aux exercices avec charge', 'Automatic warm-ups are for weighted exercises')); return false; }
  if(ex.sets.some(function(s){ return s.warm && s.done; }) || ex.sets.some(function(s){ return !s.warm && s.done; })){ if(!silent) toast(L('L\'exercice a déjà commencé', 'This exercise has already started')); return false; }
  var fw = ex.sets.filter(function(s){ return !s.warm; })[0], W = fw && (fw.w != null ? fw.w : fw.sw);
  if(!W){ if(!silent) toast(L('Indique d\'abord la charge de ta première série', 'Enter the weight of your first work set first')); return false; }
  var bar = barOn(ex.name) ? barW() : 0, steps = W >= 60 ? [[0, 10], [.5, 5], [.7, 3], [.85, 1]] : W >= 30 ? [[.5, 8], [.75, 4]] : [[.6, 8]];
  var out = [], last = 0;
  steps.forEach(function(st){
    var w = st[0] === 0 ? bar : Math.max(bar, roundInc(W * st[0]));
    if(!w || w <= last || w >= W) return;
    last = w; out.push({lo:st[1], hi:st[1], special:null, warm:true, auto:true, rest:st[0] >= .85 ? 90 : 60, done:false, w:null, r:null, sw:w, sr:st[1]});
  });
  if(!out.length){ if(!silent) toast(L('Charge trop légère pour un échauffement', 'Too light for a warm-up')); return false; }
  ex.sets = out.concat(ex.sets.filter(function(s){ return !s.warm; })); ex.sel = null;
  return true;
}

/* ---------- supersets ---------- */
function ssPartner(i){
  var x = S.active && S.active.exercises; if(!x || !x[i]) return null;
  if(x[i].ss && x[i + 1]) return i + 1;
  if(i > 0 && x[i - 1].ss) return i - 1;
  return null;
}
function hasWork(ex){ return !!ex && ex.sets.some(function(s){ return !s.done && !s.warm; }); }
/* séances dont la note annonce un superset : on relie les deux exercices une fois, ensuite c'est l'utilisateur qui décide */
function ssMigrate(){
  var ch = false;
  S.programs.forEach(function(p){ p.workouts.forEach(function(w){
    if(w.ssDone) return; w.ssDone = true; ch = true;
    w.ex.forEach(function(e, i){ var prev = w.ex[i - 1]; if(w.ex[i + 1] && !(prev && prev.ss) && /superset/i.test(e.cue || '')) e.ss = true; });
  }); });
  if(ch) save();
}

/* ---------- durées ---------- */
function estDur(w){
  var past = S.history.filter(function(h){ return h.pid === w.id && !h.demo && h.dur > 600 && h.dur < 4 * 3600; }).slice(-5).map(function(h){ return h.dur; });
  if(past.length >= 2){ past.sort(function(a, b){ return a - b; }); return past[Math.floor(past.length / 2)]; }
  var t = 0;
  w.ex.forEach(function(e, i){ e.s.forEach(function(s, j){ t += s.warm ? 30 : 45; if(j < e.s.length - 1 || i < w.ex.length - 1) t += s.rest || e.rest || 90; }); t += 45; });
  return t;
}
function remainSec(a){
  var t = 0, ri = restInfo(); if(ri && !ri.over) t += ri.left;
  a.exercises.forEach(function(e, i){ e.sets.forEach(function(s, j){
    if(s.done) return; t += s.warm ? 30 : 45;
    if(j < e.sets.length - 1 || i < a.exercises.length - 1) t += s.rest || (s.warm ? 60 : e.rest) || 90;
  }); });
  return t;
}
function etaTxt(a){ return hm(Date.now() + remainSec(a) * 1000); }
function lastAct(a){ var t = a.start; a.exercises.forEach(function(e){ e.sets.forEach(function(s){ if(s.doneAt && s.doneAt > t) t = s.doneAt; }); }); return t; }

/* ---------- séance oubliée ouverte ---------- */
function staleOn(){ return !!(S.active && !ui.staleOk && ui.screen !== 'done' && Date.now() - lastAct(S.active) > 3 * 3600e3); }
function vStale(){
  var a = S.active, t = lastAct(a), n = 0; a.exercises.forEach(function(e){ e.sets.forEach(function(s){ if(s.done) n++; }); });
  var day = dayKey(a.start) === dayKey(Date.now()) ? '' : L(' le ', ' on ') + fmtDate(a.start);
  var h = '<div class="pane m3-stale" role="dialog" aria-label="' + L('Séance toujours ouverte', 'Session still open') + '"><div class="m3f-grab"></div>';
  h += '<span class="m3-eyebrow">' + L('SÉANCE TOUJOURS OUVERTE', 'SESSION STILL OPEN') + '</span><h2>' + esc(trText(a.name)) + '</h2>';

function cleanSet(s){ return {lo:s.lo, hi:s.hi, special:s.special || null, warm:!!s.warm, rest:s.rest, done:false, w:null, r:null}; }
function doReplace(name){
  var a = S.active, i = a.idx, ex = a.exercises[i], old = ex.name;
  ui.picker = null;
  if(fold(name) === fold(old)){ render(); return; }
  var note = ex.note || lastNote(name, a.pid) || '';
  if(ex.sets.some(function(s){ return s.done; })){
    var left = ex.sets.filter(function(s){ return !s.done && !s.warm; });
    if(!left.length){ toast(L('Cet exercice est déjà terminé', 'This exercise is already done')); render(); return; }
    /* les séries déjà faites restent sur l'ancien exercice, les séries restantes passent sur le nouveau */
    var nex = {tpl:ex.tpl, name:name, variants:null, rest:ex.rest, cue:ex.cue, note:note, sel:null, ss:ex.ss, replaced:old, sets:left.map(cleanSet), pre:ex.sets.filter(function(s){ return s.done && !s.auto; }).map(function(s){ return {lo:s.lo, hi:s.hi, special:s.special, warm:s.warm, rest:s.rest, r:s.r}; })};
    ex.sets = ex.sets.filter(function(s){ return s.done; }); ex.partial = true; ex.tpl = null; ex.ss = false; ex.sel = null;
    a.exercises.splice(i + 1, 0, nex); a.idx = i + 1;
    if(a.rest && a.rest.ex > i) a.rest.ex++;
    fillSuggestions(nex); if(autoWarmOn(name)) genWarm(nex, true);
  } else {
    ex.name = name; ex.variants = null; ex.replaced = old; ex.note = note; ex.sel = null;
    ex.sets = ex.sets.filter(function(s){ return !s.auto; }).map(cleanSet);
    fillSuggestions(ex); if(autoWarmOn(name)) genWarm(ex, true);
  }
  save(); render();

  toast(exDisp(old) + ' → ' + exDisp(name));
}

/* ---------- actions de la 1.15 : écoutées avant le moteur principal ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest && ev.target.closest('[data-a],[data-pad]'); if(!el) return;
  if(lp && lp.skip && el.closest('[data-a="w"],[data-a="r"]')){ ev.stopPropagation(); ev.preventDefault(); return; }
  var stop = function(){ ev.stopPropagation(); ev.preventDefault(); render(); };
  var pd = el.getAttribute('data-pad');
  if(pd && S.active){ ui.pad = {f:pd, v:''}; return stop(); }
  var a = el.getAttribute('data-a'), ex = cur(), d = +el.getAttribute('data-d') || 0, j, s, rec, rr;
  switch(a){
    case 'closesheet':
      if(el.classList.contains('sheet') && ev.target !== el) return;
      ui.pad = null; ui.addPast = null;
      if(ui.hEdit) finishHistEdit();
      if(ui.picker && ui.pickHist){ ui.picker = null; ui.daySheet = ui.pickHist.day; ui.hEdit = ui.pickHist.id; ui.pickHist = null; return stop(); }
      return;
    case 'skip': ui.fixLast = false; return;
    case 'sel':
      if(!S.active) return; j = +el.getAttribute('data-j'); s = ex.sets[j];
      if(s && s.done){ s.done = false; s.redo = true; ex.sel = j; save(); return stop(); }
      return;
    case 'reopen':
      j = +el.getAttribute('data-j'); s = ex && ex.sets[j]; if(!s) return;
      s.done = false; s.redo = true; ex.sel = j; ui.fixLast = false; save(); return stop();
    case 'fixlast': ui.fixLast = true; return stop();
    case 'fixok': ui.fixLast = false; toast(L('Série corrigée', 'Set corrected')); return stop();
    case 'fxw': case 'fxr':
      rr = S.active && S.active.rest; s = rr && S.active.exercises[rr.ex] && S.active.exercises[rr.ex].sets[rr.set]; if(!s) return stop();
      if(a === 'fxw') s.w = Math.max(0, Math.round(((s.w || 0) + d * inc()) * 100) / 100);
      else s.r = Math.max(0, (s.r || 0) + d * (exType(S.active.exercises[rr.ex].name) === 'time' ? 5 : 1));
      save(); return stop();
    case 'repl': if(!S.active) return; ui.picker = {ctx:'replace'}; ui.pickQ = ''; ui.sheet = null; return stop();
    case 'autowarm':
      if(ex && genWarm(ex)){ m3map('autoWarm')[fold(ex.name)] = true; save(); toast(L('Échauffement ajouté. Il reviendra à chaque séance (réglable dans la fiche).', 'Warm-up added. It will come back every session (change it in the info sheet).')); }
      return stop();
    case 'extype':
      m3map('exType')[fold(el.getAttribute('data-n'))] = el.getAttribute('data-v');
      if(S.active) S.active.exercises.forEach(function(e){ if(fold(e.name) === fold(el.getAttribute('data-n'))) fillSuggestions(e); });
      recomputePRs(); save(); return stop();
    case 'exbar': m3map('exBar')[fold(el.getAttribute('data-n'))] = !barOn(el.getAttribute('data-n')); save(); return stop();
    case 'exwarm': var wk = fold(el.getAttribute('data-n')), aw = m3map('autoWarm'); if(aw[wk]) delete aw[wk]; else aw[wk] = true; save(); return stop();
    case 'barw': S.settings.barW = +el.getAttribute('data-v'); save(); return stop();
    case 'exss':
      var tw = ui.edWk && prog(ui.edWk), ti = +el.getAttribute('data-i'), te = tw && tw.ex[ti]; if(!te) return stop();
      te.ss = !te.ss; tw.ssDone = true;
      if(te.ss){ if(tw.ex[ti - 1]) tw.ex[ti - 1].ss = false; if(tw.ex[ti + 1]) tw.ex[ti + 1].ss = false; }
      save(); return stop();
    case 'stalefin': ev.stopPropagation(); ev.preventDefault(); finish(lastAct(S.active) + 60e3); return;
    case 'staleok': ui.staleOk = true; return stop();
    case 'staledrop': S.active = null; ui.confirm = null; ui.screen = 'home'; ui.staleOk = false; save(); releaseWake(); toast(L('Séance abandonnée', 'Session discarded')); return stop();
    case 'padk': if(ui.pad) padKey(el.getAttribute('data-k')); return stop();
    case 'padok': if(ui.pad) padOk(); return stop();
    case 'recall': ui.allRec = !ui.allRec; if(!ui.allRec) ui.recQ = ''; return stop();
    case 'addpast': var nx = m3kTodayWorkout ? m3kTodayWorkout() : null, yd = new Date(Date.now() - 864e5); ui.addPast = {wid:nx ? nx.id : '', date:yd.getFullYear() + '-' + pad2(yd.getMonth() + 1) + '-' + pad2(yd.getDate())}; return stop();
    case 'pastok': pastCreate(); return stop();
    case 'hedit': if(ui.hEdit && ui.hEdit !== el.getAttribute('data-id')) finishHistEdit(); ui.hEdit = el.getAttribute('data-id'); ui.confirm = null; return stop();
    case 'hdone': finishHistEdit(); return stop();
    case 'askhdel': ui.confirm = 'hdel:' + el.getAttribute('data-id'); return stop();
    case 'hdel':
      rec = histById(el.getAttribute('data-id')); if(!rec) return stop();
      S.history = S.history.filter(function(x){ return x !== rec; }); try{ dropPhoto(rec.id); }catch(e){}
      ui.confirm = null; ui.hEdit = null; if(!S.history.some(function(x){ return dayKey(x.date) === ui.daySheet; })) ui.daySheet = null;
      recomputePRs(); save(); toast(L('Séance supprimée', 'Session deleted')); return stop();
    case 'hsadd': case 'hsdel': case 'hwarm': case 'hexdel':
      rec = histById(el.getAttribute('data-id')); var he = rec && rec.exercises[+el.getAttribute('data-e')]; if(!he) return stop();
      var hs = +el.getAttribute('data-s');
      if(a === 'hsadd'){ var lw = he.sets.filter(function(x){ return !x.warm; }).slice(-1)[0]; he.sets.push({w:lw ? lw.w : null, r:lw ? lw.r : null, warm:false, special:null}); }
      else if(a === 'hsdel') he.sets.splice(hs, 1);
      else if(a === 'hwarm'){ if(he.sets[hs]) he.sets[hs].warm = !he.sets[hs].warm; }
      else rec.exercises.splice(+el.getAttribute('data-e'), 1);
      recomputePRs(); save(); return stop();
    case 'hexadd': ui.pickHist = {id:el.getAttribute('data-id'), day:ui.daySheet}; ui.daySheet = null; ui.picker = {ctx:'hist'}; ui.pickQ = ''; return stop();
  }
}, true);

  var best = null;

function m5Plateau(){

      if(tops.length === 3 && tops[0].w === tops[2].w && tops[1].w === tops[0].w && tops[0].r <= tops[2].r) return {n:n, w:tops[0].w, r:tops[0].r};

  cards[i].classList.add('fl-lift');
