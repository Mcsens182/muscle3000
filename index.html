<style id="m3k-v2-editorial">
/* MUSCLE 3000 V2 — Editorial / Coaching redesign
   Functional architecture intentionally preserved. */
:root{
  --ground:#F4F1E9 !important;
  --ink:#18231C !important;
  --muted:#68736B !important;
  --track:#D7DDD6 !important;
  --acc:#1E5B45 !important;
  --acc-ink:#F4F1E9 !important;
  --paper:#FFFFFF !important;
  --soft:#E8EDE7 !important;
  --line:#D8DED8 !important;
  --display:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif !important;
  --mono:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif !important;
}
html,body{background:var(--ground)!important;color:var(--ink)!important}
/* iOS : bloque l'effet élastique quand on arrive en haut ou en bas, la barre du bas reste en place */
html,body{overscroll-behavior:none!important}
body{font-family:var(--mono)!important;font-size:14px!important;letter-spacing:-.01em}
#app{max-width:560px!important;padding:0 18px 92px!important;gap:14px!important}
button,input,textarea{font-family:var(--mono)!important}
button{border:1px solid var(--line)!important;border-radius:14px!important;background:var(--paper)!important;color:var(--ink)!important;min-height:46px!important;font-weight:700!important}
button.solid,.go.solid,.go[data-a=start],body.acc .go[data-a=start],body.acc [data-a=validate],body.acc [data-a=askfinish]{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.box{border:1px solid var(--line)!important;border-radius:20px!important;background:var(--paper)!important;padding:16px!important;box-shadow:0 8px 28px rgba(24,35,28,.05)!important}
.inv{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.disp{font-family:var(--display)!important;text-transform:none!important;letter-spacing:-.045em!important;font-weight:800!important}
.lbl{font-size:10px!important;letter-spacing:.11em!important;color:var(--muted)!important}
.top{padding-top:18px!important;min-height:48px!important;color:var(--muted)!important}
.top button{border:0!important;background:transparent!important;padding:0!important;color:var(--ink)!important}
.week{gap:6px!important}
.day{height:62px!important;border:1px solid var(--line)!important;border-radius:15px!important;background:var(--paper)!important;color:var(--muted)!important}
.day.prog{border:1px solid var(--ink)!important}
.day.today{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.day .disp{font-size:12px!important}
/* Home hero */
.box.inv .disp{font-size:clamp(38px,11vw,64px)!important;line-height:.95!important}
.box.inv .chip{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.25)!important;color:#fff!important;border-radius:999px!important}
.box.inv .go{border-radius:14px!important;min-height:54px!important;margin-top:4px}
/* Progress/stat cards */
.grid2,.grid3{gap:8px!important}
.grid2>.box,.grid3>.box{background:var(--paper)!important}
.chip{border:1px solid var(--line)!important;border-radius:999px!important;background:var(--soft)!important;color:var(--ink)!important;padding:6px 10px!important;min-height:30px!important}
.chip.on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
/* Exercise focus */
.exhead .card{border-radius:22px!important;background:var(--paper)!important}
.edge{border:1px solid var(--line)!important;border-radius:14px!important;background:var(--paper)!important;width:34px!important;color:var(--muted)!important}
.edge.l{border-left:1px solid var(--line)!important}.edge.r{border-right:1px solid var(--line)!important}
.set.lbl{color:var(--muted)!important;border:0!important;background:transparent!important}
.set{border:1px solid var(--line)!important;border-radius:13px!important;margin-bottom:6px!important;background:var(--paper)!important;min-height:52px!important}
.set.sel{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.set.todo{border-style:dashed!important;color:var(--muted)!important}
.set .num{border:1px solid currentColor!important;border-radius:8px!important}
.set .num.ok{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.gap.plan,.gap{color:var(--muted)!important}
.note{border-top:1px solid var(--line)!important;color:var(--ink)!important}
/* Rest */
.restbar{background:var(--ink)!important;color:#fff!important;border-radius:0 0 16px 16px!important;padding-top:10px!important}
.restbar .tr{background:#39443D!important}.restbar .fl{background:#fff!important}
/* Navigation */
.nav{position:fixed!important;z-index:30!important;left:50%!important;bottom:14px!important;transform:translateX(-50%)!important;width:min(524px,calc(100vw - 28px))!important;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:6px!important;box-shadow:0 12px 36px rgba(24,35,28,.12)!important;display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:4px!important}
.nav button{border:0!important;background:transparent!important;border-radius:14px!important;min-height:50px!important;font-size:9px!important;letter-spacing:.05em!important;padding:0 2px!important;color:var(--muted)!important}
.nav button.on{background:var(--ink)!important;color:#fff!important}
.badge{background:#D36B45!important;color:#fff!important;border-radius:99px!important;padding:2px 5px!important}
/* Sheets / editors */
.sheet .pane{background:var(--ground)!important}
.field,input,textarea{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:12px!important;color:var(--ink)!important}
/* Lists become editorial cards */
.exrow{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:16px!important;padding:15px!important}
/* Resting / completion accents */
body.acc .hc.on{background:var(--acc)!important;border-color:var(--acc)!important}
body.acc .acc-prog{background:var(--acc)!important;border-color:var(--acc)!important}
/* Reduce visual noise from old HUD rules */
.progress,.track{border-radius:999px!important}
@media(min-width:700px){#app{padding-top:8px!important}.nav{bottom:22px!important}}
</style>

/* library search: built-in + custom + any name already used in programmes or history */
function fold(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function library(){
  var out = [], seen = {};

  LIB.forEach(function(e){ add(e.n, e.g, e.c); });
  S.customEx.forEach(function(e){ add(e.n, e.g, false, true); });
  allEx(function(e){ add(e.name, 'Autre', false, true); (e.v || []).forEach(function(v){ add(v, 'Autre', false, true); }); });
  return out;
}
function libFind(n){ var k = fold(n), L = library(); for(var i=0;i<L.length;i++) if(fold(L[i].n) === k) return L[i]; for(var o in EQREN) if(fold(o) === k) return libFind(EQREN[o]); return null; }
function libSearch(q, group){
  var words = fold(q).split(' ').filter(Boolean);
  var res = library().filter(function(e){
    if(group && e.g !== group) return false;
    var hay = fold(e.n + ' ' + e.g + ' ' + eqLbl(eqOf(e.n)) + (isEN() ? ' ' + exDisp(e.n) + ' ' + (GRN[e.g] || '') : ''));
    return words.every(function(w){ return hay.indexOf(w) >= 0; });
  });
  var f = fold(q);
  res.sort(function(a, b){
    var an = exDisp(a.n), bn = exDisp(b.n), sa = fold(an).indexOf(f) === 0 || fold(a.n).indexOf(f) === 0 ? 0 : 1, sb = fold(bn).indexOf(f) === 0 || fold(b.n).indexOf(f) === 0 ? 0 : 1;
    return sa - sb || GROUPS.indexOf(a.g) - GROUPS.indexOf(b.g) || an.localeCompare(bn, isEN() ? 'en' : 'fr');
  });
  return res;
}

/* history lookups */
/* renommer un exercice : l'historique, les records, les réglages et toutes les séances suivent le nouveau nom */
function renameEx(old, nn){
  if(!old || !nn || old === nn) return 0;
  var moved = 0, fo = fold(old), fn = fold(nn);
  var fix = function(list){ (list || []).forEach(function(e){
    if(e.name === old) e.name = nn;
    ['v', 'variants'].forEach(function(k){ if(Array.isArray(e[k])){ var i = e[k].indexOf(old); if(i >= 0) e[k][i] = nn; } });
  }); };
  S.history.forEach(function(h){ (h.exercises || []).forEach(function(e){ if(e.name === old){ e.name = nn; moved++; } }); });
  (S.programs || []).forEach(function(p){ (p.workouts || []).forEach(function(w){ fix(w.ex); }); });
  if(S.active) fix(S.active.exercises);
  ['exType', 'exBar', 'autoWarm'].forEach(function(k){ var m = m3map(k); if(fo in m && !(fn in m)) m[fn] = m[fo]; });
  (S.customEx || []).forEach(function(c){ if(fold(c.n) === fo) c.n = nn; });
  if(moved) recomputePRs();
  return moved;
}
/* noms d'exercices qui n'existent plus que dans l'historique (renommés avant, ou retirés du programme) */
function orphanNames(name){
  var used = {}, cnt = {}, fn = fold(name);
  (S.programs || []).forEach(function(p){ (p.workouts || []).forEach(function(w){ (w.ex || []).forEach(function(e){ used[e.name] = 1; (e.v || []).forEach(function(v){ used[v] = 1; }); }); }); });
  if(S.active) S.active.exercises.forEach(function(e){ used[e.name] = 1; });
  S.history.forEach(function(h){ var seen = {}; (h.exercises || []).forEach(function(e){ if(!seen[e.name]){ seen[e.name] = 1; cnt[e.name] = (cnt[e.name] || 0) + 1; } }); });
  var words = fn.split(' ').filter(function(w){ return w.length > 2; });
  return Object.keys(cnt).filter(function(n){ return n !== name && !used[n]; }).map(function(n){
    var fo = fold(n), sim = words.filter(function(w){ return fo.indexOf(w) >= 0; }).length;
    return {n:n, c:cnt[n], sim:sim};
  }).sort(function(a, b){ return b.sim - a.sim || b.c - a.c || a.n.localeCompare(b.n); });
}
function pastEntries(name){
  var out = [];
  for(var i = S.history.length - 1; i >= 0; i--){
    var h = S.history[i];
    for(var j = 0; j < h.exercises.length; j++){
      var e = h.exercises[j];
      if(e.name === name){ out.push({date:h.date, note:e.note, sets:e.sets.filter(function(s){ return !s.warm; }), all:e.sets}); break; }
    }
  }
  return out;
}
/* notes belong to one exercise inside one séance: the same exercise in another séance or programme starts blank */
/* names: one exercise name, or all the variants of one slot (the note is shared across variants) */
function lastNote(names, pid){
  var keys = [].concat(names).map(function(n){ return fold(n); });
  for(var i = S.history.length - 1; i >= 0; i--){
    var h = S.history[i]; if(h.pid !== pid) continue;
    for(var j = 0; j < h.exercises.length; j++){ var e = h.exercises[j]; if(e.note && keys.indexOf(fold(e.name)) >= 0) return e.note; }
  }
  return '';

/* double progression */
function suggest(name, k, set){
  var past = pastEntries(name);
  var g = past[0] && past[0].sets[k];
  if(!g || g.w == null) return null;
  var xt = exType(name);
  if(xt !== 'w'){
    var st = xt === 'time' ? 5 : 1, w0 = g.w || 0;
    if(set.special || g.r < set.lo) return {w:w0, r:set.lo, trend:'='};
    return {w:w0, r:g.r + st, trend:'+1'};
  }
  if(set.special) return {w:g.w, r:set.lo, trend:'='};
  if(g.r >= set.hi) return {w:g.w + inc(), r:set.lo, trend:'▲'};
  if(g.r < set.lo){
    var g2 = past[1] && past[1].sets[k];
    if(g2 && g2.w === g.w && g2.r < set.lo) return {w:Math.max(0, g.w - inc()), r:set.lo, trend:'▼'};
    return {w:g.w, r:set.lo, trend:'='};
  }
  return {w:g.w, r:g.r + 1, trend:'+1'};
}
function ghost(name, k){ var p = pastEntries(name); var g = p[0] && p[0].sets[k]; return g ? fmtS(name, g.w, g.r) : '—'; }
function workIndex(ex, j){ var k = 0; for(var i=0;i<j;i++) if(!ex.sets[i].warm) k++; return k; }
function fillSuggestions(ex){
  ex.sets.forEach(function(s, j){
    if(s.done || s.warm) return;
    var sg = suggest(ex.name, workIndex(ex, j), s);
    /* la proposition reste en grisé (sw / sr) : elle ne devient la perf du jour qu'à la validation ou quand on la touche */
    if(sg){ s.sw = sg.w; s.sr = sg.r; s.trend = sg.trend; }
    else { s.trend = null; s.sr = s.lo; }
  });
  /* warm-ups: last session's warm-up weights, else a ramp toward the first work set */
  var firstWork = ex.sets.filter(function(s){ return !s.warm; })[0];
  var past = pastEntries(ex.name)[0], pastW = past ? past.all.filter(function(s){ return s.warm; }) : [];
  var nW = ex.sets.filter(function(s){ return s.warm; }).length, wi = 0;
  ex.sets.forEach(function(s){
    if(!s.warm) return; var idx = wi++; if(s.done || s.auto) return;
    var fw = firstWork && (firstWork.w != null ? firstWork.w : firstWork.sw);
    if(pastW[idx] && pastW[idx].w != null){ s.sw = pastW[idx].w; s.sr = pastW[idx].r; }
    else if(fw){ s.sw = roundInc(fw * (0.4 + 0.45 * (idx + 1) / (nW + 1))); }
    if(s.r == null && s.sr == null) s.sr = s.lo || 8;
  });
}

function wLabel(w){ return w >= 1000 ? kg(Math.round(w / 100) / 10) + ' t' : w + ' kg'; }

function funFact(vol){
  if(!vol) return null;

  EQUIV.forEach(function(e){ var q = vol / e[0], dist = Math.abs(Math.log(q)); if(q >= 0.8 && (!best || dist < best.dist)) best = {q:q, e:e, dist:dist}; });
  if(!best) best = {q:vol / EQUIV[0][0], e:EQUIV[0]};

  if(n < 1) n = 1;
  var nm = n >= 2 ? best.e[2] : best.e[1];
  if(isEN()){ var en = EQUIV_EN[EQUIV.indexOf(best.e)].split('|'); nm = n >= 2 ? en[1] : en[0]; }
  return {count:kg(n), name:nm, unit:wLabel(best.e[0]) + (n >= 2 ? (isEN() ? ' each' : ' chacun') : ''), exact:n === Math.round(q)};
}
function funLine(vol){ var f = funFact(vol); return f ? '≈ ' + f.count + ' ' + f.name.toUpperCase() : ''; }
function bestSet(r){
  var best = null;
  r.exercises.forEach(function(e){ e.sets.forEach(function(s){ if(s.warm) return; var v = score(e.name, s.w, s.r); if(!best || v > best.v) best = {v:v, n:e.name, w:s.w, r:s.r}; }); });
  return best;
}
function fitText(ctx, txt, maxW, size, font){
  var s = size; ctx.font = s + 'px ' + font;
  while(ctx.measureText(txt).width > maxW && s > 20){ s -= 4; ctx.font = s + 'px ' + font; }
  return s;
}
/* the user's own words under the title: up to 2 lines, shrinking to fit */
function drawCaption(x, txt, P, W, y, K, MONO){
  txt = String(txt || '').trim(); if(!txt) return y;
  var max = W - 2 * P, size = 40, lines;
  var wrap = function(){ var ws = txt.split(/\s+/), out = [], cur = ''; x.font = '700 ' + size + 'px ' + MONO;
    ws.forEach(function(w){ var t = cur ? cur + ' ' + w : w; if(x.measureText(t).width > max && cur){ out.push(cur); cur = w; } else cur = t; }); if(cur) out.push(cur); return out; };

function drawCard(r, photo){

  var tag = '● ' + mmss(r.dur); x.font = '700 34px ' + MONO; var tw = x.measureText(tag).width;

  } else {

    var nm = r.name.toUpperCase(), fs2 = fitText(x, nm, W - 2 * P + 6, 330, DISP); x.fillText(nm, P - 6, y + fs2 * 0.88); y += fs2 * 0.92 + 20;

      x.font = '700 34px ' + MONO; x.fillText((r.prs.length > 1 ? r.prs.length + ' NOUVEAUX RECORDS' : 'NOUVEAU RECORD'), P + 36, y + 70);
      var yy = y + 90;

    } else if(bs){

      } else {

/* ---------- story of a past séance ----------

function photoWrite(o){
  for(;;){
    try{ localStorage.setItem(PHOTO_KEY, JSON.stringify(o)); return true; }
    catch(e){ if(!o.list.length){ try{ localStorage.removeItem(PHOTO_KEY); }catch(e2){} return false; } o.list.shift(); }
  }
}
function keepPhoto(id, img){
  try{
    var cw = 936, ch = 860, c = document.createElement('canvas'); c.width = cw; c.height = ch;
    var x = c.getContext('2d'), ir = img.width / img.height, fr = cw / ch, sw, sh, sx, sy;
    if(ir > fr){ sh = img.height; sw = sh * fr; sx = (img.width - sw) / 2; sy = 0; } else { sw = img.width; sh = sw / fr; sx = 0; sy = (img.height - sh) / 2; }
    x.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    var o = photoStore(); o.list = o.list.filter(function(p){ return p.id !== id; });
    o.list.push({id:id, data:c.toDataURL('image/jpeg', .72)});
    while(o.list.length > PHOTO_MAX) o.list.shift();
    photoWrite(o);
  }catch(e){}
}
function dropPhoto(id){ var o = photoStore(), n = o.list.length; o.list = o.list.filter(function(p){ return p.id !== id; }); if(o.list.length !== n) photoWrite(o); }

function buildStory(){
  var box = document.getElementById('story-prev'), id = ui.storyId; if(!box || !id) return;
  var r = S.history.filter(function(x){ return x.id === id; })[0]; if(!r) return;
  var key = id + '|' + (r.caption || '') + '|' + S.settings.theme + (S.settings.inkAlt ? '-alt' : '');
  var show = function(){
    var b = document.getElementById('story-prev'); if(!b || ui.storyId !== id) return;
    b.innerHTML = trHTML('<img src="' + ui.storyURL + '" alt="Story de ta séance ' + esc(r.name) + '" style="width:100%;height:100%;display:block;object-fit:contain">');
    var s = document.getElementById('storysave'); if(s && ui.dl) s.hidden = false;
  };
  if(ui.storyURL && ui.storyKey === key){ show(); return; }
  var draw = function(photo){
    try{
      drawCard(r, photo).toBlob(function(b){
        if(!b) return; ui.storyBlob = b;
        if(ui.storyURL) URL.revokeObjectURL(ui.storyURL); ui.storyURL = URL.createObjectURL(b); ui.storyKey = key; show();
      }, 'image/png');
    }catch(e){ var bx = document.getElementById('story-prev'); if(bx) bx.innerHTML = trHTML('<span class="lbl" style="padding:16px;text-align:center">Impossible de générer l\'image sur ce téléphone.</span>'); }
  };
  var go = function(){
    var data = photoFor(id); if(!data){ draw(null); return; }
    var img = new Image(); img.onload = function(){ draw(img); }; img.onerror = function(){ draw(null); }; img.src = data;
  };
  try{ Promise.all([document.fonts.load('80px Anton'), document.fonts.load('700 30px "Space Mono"')]).then(go, go); }catch(e){ go(); }
}
/* ---------- backup files ----------
   One versioned JSON file holds everything needed to restore (format 1); a CSV of every set opens in Excel.
   A restore keeps a copy of the replaced data first, so it can be undone. */
var BACKUP_FORMAT = 1, UNDO_KEY = 'muscle3000.beforeRestore';
function backupData(){ return {app:'Muscle 3000', format:BACKUP_FORMAT, exportedAt:new Date().toISOString(), settings:S.settings, programs:S.programs, history:S.history, customEx:S.customEx || []}; }
function stamp(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function csvData(){
  var q = function(v){ v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['date','séance','durée (min)','exercice','série','échauffement','charge (kg)','reps','repos (s)','note'].join(';')];
  S.history.forEach(function(h){
    var d = new Date(h.date), ds = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    h.exercises.forEach(function(e){ var k = 0; e.sets.forEach(function(s){ if(!s.warm) k++; rows.push([ds, h.name, Math.round((h.dur || 0) / 60), e.name, s.warm ? 'W' : k, s.warm ? 'oui' : 'non', s.w == null ? '' : String(s.w).replace('.', ','), s.r, s.rest || '', e.note || ''].map(q).join(';')); }); });
  });
  return '﻿' + rows.join('\r\n');
}
/* the artifact's own save sheet when available, else a plain download link */
function saveFile(name, text, type){
  var blob = new Blob([text], {type:type});
  var fallback = function(){
    try{ var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 4000); return true; }catch(e){ return false; }
  };
  if(ui.dl) return ui.dl.save({filename:name, data:blob}).then(function(){ return true; }, function(err){ if(err && err.code === 'declined') return false; return fallback(); });
  return Promise.resolve(fallback());
}
/* ---------- Excel export: a real, styled workbook (Résumé, Séances, Détail des séries) ----------
   ExcelJS is fetched only when the button is pressed. */
var EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
function loadExcel(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise(function(ok, ko){
    var s = document.createElement('script'); s.src = EXCELJS_URL;
    s.onload = function(){ window.ExcelJS ? ok(window.ExcelJS) : ko(new Error('excel')); };
    s.onerror = function(){ ko(new Error('excel')); };
    document.head.appendChild(s);
  });
}

   sections:[
    {t:'La séance en liste', items:['La séance s\'affiche en entier : l\'exercice en cours est ouvert avec ses séries, les autres sont repliés. Touche un exercice pour l\'ouvrir : l\'autre se replie en douceur.','Le bouton Valider reste en bas de l\'écran, avec la série et la charge à faire. Le rond au bout de chaque ligne valide aussi la série.','Après une série, le repos prend tout l\'écran avec la suite de la séance en bas. « Réduire » le range dans une pilule en haut de l\'écran ; touche-la pour le rouvrir. Entre deux séries, le temps qui reste défile aussi dans la liste.','Touche le numéro d\'une série pour la passer en échauffement (W), touche-le encore pour revenir en arrière.','Le nom de l\'exercice ouvert ou l\'icône i affichent sa fiche. Le menu ⋯ remplace l\'exercice (ta note et tes séries suivent, pour cette séance) ou le supprime, avec « Annuler » pendant quelques secondes.','Attrape la poignée à gauche d\'un exercice et fais-le glisser pour changer l\'ordre de la séance.','« Ajouter un exercice » en bas de la liste. Le mode une série à la fois se choisit sous Terminer la séance.']},
    {t:'Une série à la fois', items:['L\'écran de séance montre seulement la série en cours : la charge et les reps proposées en grand, des boutons + et − larges, et Valider en bas.','Touche le chiffre pour ouvrir un pavé numérique géant : plus de clavier du téléphone qui cache l\'écran. Laisse le doigt appuyé sur + ou − pour faire défiler la valeur.','La charge et les reps calculées par la double progression sont en grisé : Valider sans rien toucher les enregistre. « La dernière fois » recopie ta perf précédente.','Une note par exercice s\'écrit directement sous les chiffres, d\'un tap.','L\'heure de fin prévue s\'affiche en haut, calculée avec tes temps de repos.','« Toutes les séries » ramène à la séance en liste ; l\'appli retient ton choix.']},
    {t:'Le repos', items:['Après Valider, le repos prend tout l\'écran : un grand chrono, ±15 s, et la série qui suit avec sa charge. À zéro, un petit son, puis la série suivante s\'ouvre seule.','Dans la séance en liste, le repos réduit devient une pilule en haut de l\'écran, avec +15 s à portée de doigt.','Dans Profil › Notifications, « Fin de repos » te prévient quand tu es sur une autre appli ou écran verrouillé.','Un seul réglage « Repos entre séries » par exercice, et le repos avant l\'exercice suivant sous la dernière série.']},
    {t:'Corriger une erreur', items:['Pendant le repos, touche la série que tu viens de valider pour corriger la charge ou les reps, sans arrêter le chrono.','Touche la barre d\'une série déjà faite (ou la série en vue liste) pour la rouvrir et la corriger. L\'enregistrer ne relance pas de repos.']},
    {t:'Un journal modifiable', items:['Dans une séance du Journal, « Modifier » permet de changer le nom, la date, la durée, chaque série, d\'ajouter ou retirer des séries et des exercices.','« Supprimer » retire une séance lancée par erreur.','« + Ajouter une séance oubliée » sous le calendrier : choisis la séance et le jour, elle est pré-remplie avec tes dernières charges.','Après chaque changement, records, fantôme et progression se recalculent.','Les records du Journal sont classés du plus récent au plus ancien, avec « Tout voir et chercher ».']},
    {t:'Poids du corps et durée', items:['Pompes, tractions, dips et compagnie se notent en reps, avec un lest si tu veux. La progression ajoute des reps, jamais de poids d\'office.','Le gainage et les exercices tenus se notent en secondes. La progression ajoute 5 s.','Ces exercices ont enfin leurs records et leur courbe. Le type se change dans la fiche de l\'exercice.']},
    {t:'Supersets', items:['Deux exercices liés s\'enchaînent série par série : A, B, A, B, avec le repos prévu entre chaque.','Les supersets annoncés dans tes programmes (leg curl et leg extension dans Ascension, par exemple) sont déjà liés.','Dans l\'éditeur de séance, « Mettre en superset avec le suivant » lie ou délie deux exercices.']},
    {t:'Charge et échauffement', items:['Sous la charge des exercices à la barre, les disques à mettre de chaque côté. Le poids de la barre (20, 15 ou 10 kg) se règle dans la fiche.','« Ajouter un échauffement auto » crée la montée en charge avant ta première série. Il revient à chaque séance, et se coupe dans la fiche.']},
    {t:'Remplacer un exercice', items:['Machine prise ? « ⇄ » à côté du nom de l\'exercice propose d\'abord des exercices du même groupe musculaire.','Ta note et les séries qui restent passent sur le nouvel exercice. Les séries déjà faites restent sur l\'ancien.']},
    {t:'La fin de séance', items:['Si ta séance a changé, trois choix : écraser le modèle, créer un nouveau workout avec ces modifications (rangé où tu veux), ou juste enregistrer la séance.','La liste des changements s\'affiche avant de choisir : exercices ajoutés, retirés, remplacés, séries en plus ou en moins, ordre.','Une séance restée ouverte depuis plusieurs heures ? À l\'ouverture, l\'appli propose de la terminer à l\'heure de ta dernière série.']},
    {t:'Programmes', items:['L\'onglet Programme ouvre directement la bibliothèque : tes programmes, puis les 11 prêts à l\'emploi, de 2 à 6 jours, du débutant au confirmé. Zero To Hero devient Ascension.','Touche un programme pour voir ses séances, puis une séance pour voir chaque exercice, ses séries, ses cibles et ses repos. Le crayon la modifie.','La séance libre se lance depuis Aujourd\'hui, sous la prochaine séance.','En démarrant une séance, tu vois d\'abord toutes les séries à faire. La série en grand s\'ouvre quand tu lances le premier exercice.','La barre du bas passe en icônes.','Une nouvelle installation pose quatre questions (objectif, niveau, jours, matériel) et propose le programme qui colle. Ce parcours ne s\'affiche qu\'une fois.','La durée annoncée d\'une séance s\'appuie sur tes vraies séances, ou sur tes temps de repos.']},
    {t:'Le Coach', items:['Un nouvel onglet Coach au centre de la barre, légèrement en relief, à la place d\'Exercices. Un petit point apparaît quand il a un message pour toi.','Chaque semaine, il fait ton bilan : séances faites par rapport à ton programme, et il repère un exercice qui stagne depuis trois séances.','Comme dans une messagerie, une bulle à trois points s\'affiche pendant qu\'il écrit, puis ses messages arrivent un par un, avec un emoji quand ça s\'y prête.','Le coach premium arrive bientôt : réponses à choix, diagnostic des plateaux et séances ajustées d\'un tap.']},
    {t:'Exercices dans Programme', items:['L\'onglet Programme a trois sous-onglets : Programmes, Séances et Exercices.','Séances liste toutes tes séances, programme par programme. Exercices reprend l\'ancien onglet : recherche, groupes musculaires, fiches et création d\'un exercice.']},
    {t:'Accueil, fiches et style', items:['Les carrés de l\'accueil sont des widgets : 13 infos au choix, en petit, large ou grand. Appui long pour les déplacer.','Touche un exercice de la prochaine séance pour ouvrir sa fiche : mouvement, notes, courbe de progression, records et dernières séances.','Profil › Style : Édito (clair) ou HUD (néon, sur fond noir ou blanc), avec 4 coloris.','Le Journal a son calendrier du mois et une barre de progression vers ton objectif.','Les fenêtres qui s\'ouvrent par le bas se ferment en les glissant vers le bas. La barre du bas flotte au-dessus du contenu.']},
    {t:'Sauvegarde et corrections', items:['En fin de séance, l\'appli te propose d\'envoyer ta sauvegarde toutes les 10 séances (réglable dans Profil › Sauvegarde).','L\'éditeur de séance s\'ouvre de nouveau correctement.']}
   ],
   en:{t:'Guided sessions, an editable log and a new look',
   summary:['During a session, the whole session in a list with the current exercise open. After each set, the rest fills the screen and minimises into a pill at the top.','Drag an exercise to reorder it, remove or replace it from its ⋯ menu, and turn a set into a warm-up by tapping its number.','A mistake? Fix the set you just logged during the rest, or any set by tapping its bar.','Your log is now editable: fix, delete or add a missed session. Records are recalculated.','Push-ups, pull-ups, dips and planks work as bodyweight or timed exercises, with their own records.','Real supersets, automatic warm-ups, a plate calculator, and swapping an exercise when the machine is taken.','After a changed session, three clear choices: overwrite the template, create a new workout or just save.','A new HUD style, 4 colorways, Home widgets, a library of 11 programs and a guided first launch.'],
   sections:[
    {t:'The session list', items:['The whole session on one screen: the current exercise is open with its sets, the others are folded. Tap an exercise to open it: the other one folds away smoothly.','The Log button stays at the bottom of the screen with the set and weight to do. The circle at the end of each row logs that set too.','After a set, the rest fills the screen with the rest of the session at the bottom. “Minimise” tucks it into a pill at the top; tap it to open it again. Between sets, the time left also counts down in the list.','Tap a set number to make it a warm-up (W), tap again to undo.','The open exercise name or the i icon shows its info sheet. The ⋯ menu replaces the exercise (your note and sets follow, for this session) or removes it, with “Undo” for a few seconds.','Grab the handle on the left of an exercise and drag it to reorder the session.','“Add an exercise” at the bottom of the list. One set at a time is chosen under Finish the session.']},
    {t:'One set at a time', items:['The session screen shows only the current set: suggested weight and reps in big type, wide + and − buttons, and Log at the bottom.','Tap a number to open a giant keypad: no more phone keyboard covering the screen. Hold + or − to scroll the value.','Double progression suggestions are greyed out: Log without touching anything saves them. “Last time” copies your previous performance.','One note per exercise, typed right under the numbers.','The expected end time shows at the top, based on your rest times.','“All sets” goes back to the session list; the app remembers your choice.']},
    {t:'Rest', items:['After Log, the rest fills the screen: a big timer, ±15 s, and the next set with its weight. At zero, a short sound, then the next set opens by itself.','In the session list, the minimised rest becomes a pill at the top of the screen, with +15 s within reach.','In Settings › Notifications, “End of rest” alerts you when you are in another app or the screen is locked.','One “Rest between sets” setting per exercise, and the rest before the next exercise under the last set.']},
    {t:'Fix a mistake', items:['During the rest, tap the set you just logged to fix its weight or reps, without stopping the timer.','Tap the bar of a finished set (or the set in list view) to reopen and fix it. Saving it does not start a new rest.']},
    {t:'An editable log', items:['In a session of your log, “Edit” changes the name, date, length and every set, and adds or removes sets and exercises.','“Delete” removes a session started by mistake.','“+ Add a missed session” under the calendar: pick the session and the day, it is prefilled with your last weights.','After every change, records, ghost and progression are recalculated.','Log records are sorted from newest to oldest, with “See all and search”.']},
    {t:'Bodyweight and time', items:['Push-ups, pull-ups, dips and co. are logged in reps, with extra weight if you like. Progression adds reps, never weight on its own.','Planks and holds are logged in seconds. Progression adds 5 s.','These exercises finally have their records and chart. Change the type in the exercise info sheet.']},
    {t:'Supersets', items:['Two linked exercises alternate set by set: A, B, A, B, with the planned rest in between.','Supersets announced in your programs (leg curl and leg extension in Ascension, for example) are already linked.','In the session editor, “Superset with the next one” links or unlinks two exercises.']},
    {t:'Weight and warm-up', items:['Under the weight of barbell exercises, the plates to load on each side. The bar weight (20, 15 or 10 kg) is set in the info sheet.','“Add an automatic warm-up” builds the ramp-up before your first set. It comes back every session, and can be turned off in the info sheet.']},
    {t:'Swap an exercise', items:['Machine taken? “⇄” next to the exercise name suggests the same muscle group first.','Your note and the remaining sets move to the new exercise. Sets already done stay on the old one.']},
    {t:'End of session', items:['If your session changed, three choices: overwrite the template, create a new workout with these changes (wherever you like), or just save the session.','The list of changes shows before you choose: exercises added, removed or swapped, more or fewer sets, order.','A session left open for hours? When you open the app, it offers to finish it at the time of your last set.']},
    {t:'Programs', items:['The Program tab opens straight on the library: your programs, then the 11 ready-made ones, 2 to 6 days, beginner to advanced. Zero To Hero becomes Ascension.','Tap a program to see its sessions, then a session to see every exercise with its sets, targets and rest. The pencil edits it.','Free sessions start from Today, under the next session.','When a session starts, you first see every set to do. The big single-set view opens when you launch the first exercise.','The bottom bar now uses icons.','A new install asks four questions (goal, level, days, equipment) and suggests the right program. This only shows once.','A session\'s announced length is based on your real sessions, or on your rest times.']},
    {t:'Home, info sheets and style', items:['Home tiles are widgets: 13 infos to choose from, small, wide or large. Long press to move them.','Tap an exercise of the next session to open its info: movement, notes, progress chart, records and recent sessions.','Settings › Style: Editorial (light) or HUD (neon, on black or white), with 4 colorways.','The log has its month calendar and a progress bar toward your goal.','Bottom sheets close with a swipe down. The bottom bar floats above the content.']},
    {t:'Backup and fixes', items:['At the end of a session, the app offers to send your backup every 10 sessions (change it in Settings › Backup).','The session editor opens properly again.']}
   ]}},
  {v:'1.11', d:'14.10.26', t:'Lisible, import et anglais',
   summary:['Un nouveau style dans les Réglages : Lisible. Fond sombre, une seule couleur pour ce qui compte, et des chiffres qui se lisent d\'un coup d\'œil.','Tu viens d\'une autre appli ? Importe tout ton historique depuis son export CSV.','En séance, touche un temps de repos pour le régler sur place.','L\'appli parle aussi anglais : choisis ta langue dans les Réglages.'],
   sections:[
    {t:'Le mode Lisible', items:['Dans Réglages › Style, choisis entre Brutal et Lisible. Tu bascules quand tu veux : ton historique, tes programmes et tes notes restent les mêmes.','En Lisible, le coloris choisi colore uniquement les repères : le bouton principal, le chrono, la série en cours et tes progressions.','Plus de bordures épaisses : les blocs se distinguent par l\'espace et de légers fonds.','Les chiffres (charges, reps, chrono, stats) passent dans une police plus lisible, les titres gardent leur caractère.']},
    {t:'En séance', items:['Touche un temps de repos entre deux séries pour l\'ajuster de 15 en 15 secondes, sans quitter l\'exercice. Le repos avant l\'exercice suivant se règle de la même façon.','L\'en-tête de l\'exercice est allégé : seul le numéro de l\'exercice reste affiché.']},
    {t:'Importer tes données', items:['Dans Réglages › Sauvegarde, « Importer des données (CSV) » lit le fichier CSV exporté par ton ancienne appli d\'entraînement.','Tes séances importées s\'ajoutent à ton historique : rien n\'est remplacé, et celles déjà présentes sont ignorées.','Chaque exercice du fichier est relié à son équivalent Muscle 3000 (tu peux corriger) : ton passé nourrit tout de suite le fantôme, la progression et tes records.','Échauffements, drop sets, notes et temps de repos suivent. Les charges en livres sont converties en kilos.','Un import peut s\'annuler d\'un geste.']},
    {t:'Français ou anglais', items:['Dans Réglages › Langue, passe toute l\'appli en anglais, et reviens au français quand tu veux.','Tout suit : écrans, noms d\'exercices, mot du jour, carte à partager, tableau Excel, et même le sergent instructeur.','La recherche d\'exercices comprend aussi les noms anglais.','Tes données ne bougent pas : historique, programmes et notes restent les mêmes dans les deux langues.']}
   ]},
  {v:'1.9', d:'13.10.26', t:'Le lancement',
   summary:['Muscle 3000 est né : tes programmes, des séances guidées et la double progression qui calcule tes charges.','Des stats qui motivent et une carte à partager en fin de séance.','Un mot chaque matin, taillé sur ton historique.','Ton historique se feuillette séance par séance.','Chaque exercice montre son mouvement en deux images.'],
   sections:[
    {t:'Les bases', items:['Le programme Ascension prêt à l\'emploi.','La double progression calcule ta charge à chaque série, avec ton fantôme de la dernière fois.','Le chrono de repos en grand, le swipe entre exercices, les échauffements et une note par exercice.','4 coloris : Acid, Blaze, Ice et Nuit.']},
    {t:'Tes programmes', items:['Crée tes programmes et tes séances, avec un jour pour chacune.','Reps, échauffements et temps de repos se règlent série par série.','Les variantes (squat ou deadlift…) partagent la même note.','Environ 150 exercices classés par muscle, avec une recherche qui trouve pendant que tu tapes. Un exercice manque ? Crée-le en deux secondes.']},
    {t:'Des séances qui s\'adaptent', items:['Tu modifies ta séance en cours de route ? À la fin, mets à jour la séance d\'origine, ou garde-la comme nouvelle séance dans un programme ou dans tes séances libres.','Les séances libres vivent hors programme et sans jour : lance-les depuis « Autre séance » sur l\'accueil.','Improvise avec « + Séance vide » : ajoute tes exercices en route, et décide à la fin si tu la gardes.','Dans une séance libre, glisse vers l\'exercice suivant après le dernier pour en ajouter un nouveau.','Tu peux retirer un exercice pendant la séance.']},
    {t:'Des stats qui motivent', items:['Touche une stat de l\'accueil pour changer de vue : régularité, fréquence, volume, séances ou séries par semaine, progressions sur 6 semaines, 3 mois ou depuis le début, totaux du mois ou de l\'année. Ton choix est gardé.','Sur l\'accueil : ta série de semaines, ton volume semaine par semaine et tes plus grosses progressions.','Trois camemberts (zones, muscles, intensité) : touche le centre pour passer de l\'un à l\'autre.','Un calendrier des 12 dernières semaines pour ne pas casser la chaîne.']},
    {t:'Partage ta séance', items:['En fin de séance, une carte format story, avec ou sans ta photo.','Ton volume du jour converti en objet réel : une Fiat 500, un T-rex, le bourdon de Notre-Dame…']},
    {t:'Le mot du jour', items:['À la première ouverture de la journée, l\'appli te salue selon ton historique : régularité, records, petite forme, séance zappée, jambes oubliées ou longue pause.','Avec une stat rien qu\'à toi : ce que tu as soulevé la dernière fois sur la séance du jour et ce que la progression te demande, ou le bilan de ta dernière séance.','Si une séance est prévue ce jour-là, tu la lances directement depuis ce message. Tu peux le revoir depuis les Réglages.']},
    {t:'Les fiches d\'exercice', items:['Chaque exercice montre son mouvement : un petit mannequin aux couleurs de ton thème, en position de départ et d\'arrivée.','Ton historique et tes records juste en dessous.']},
    {t:'Ton historique', items:['Touche un jour du calendrier ou une séance de la liste pour la revoir : durée, volume et chaque série.','Passe à la séance précédente ou suivante avec les deux boutons en haut.','La fiche d\'un exercice ouverte depuis une séance a un bouton retour pour revenir là où tu étais.','Le bouton « Partager en story » recrée la carte à partager de n\'importe quelle séance, avec ta photo pour les 5 dernières séances partagées.']},
    {t:'Tes données en sécurité', items:['Exporte toutes tes données dans un fichier, à garder où tu veux (mail, Drive, notes), et restaure-les en un geste.','Un vrai classeur Excel mis en forme : un résumé avec tes records, une ligne par séance, et le détail de chaque série.','Une restauration peut s\'annuler : tes données d\'avant sont gardées de côté.','Un rappel si ta dernière sauvegarde date de plus d\'un mois.']},
    {t:'Sans filtre', items:['Un interrupteur dans les Réglages confie l\'appli à un sergent instructeur : boutons, titres, remarques après chaque série et mot du matin passent en mode caserne. Mêmes infos, zéro pitié.']},
    {t:'Et aussi', items:['L\'appli a un nom : Muscle 3000.','Une pastille te signale chaque nouveauté dans les Réglages.']}
   ]}
];
CHANGELOG.filter(function(c){ return c.v === '1.11'; })[0].en = {t:'Readable, import and English',
  summary:['A new style in Settings: Readable. Dark background, a single color for what matters, and numbers you read at a glance.','Coming from another app? Import your whole history from its CSV export.','During a session, tap a rest time to adjust it on the spot.','The app speaks English too: pick your language in Settings.'],
  sections:[
    {t:'Readable mode', items:['In Settings › Style, choose between Brutal and Readable. Switch whenever you like: your history, programs and notes stay the same.','In Readable, your colorway only paints the markers: the main button, the timer, the current set and your progress.','No more thick borders: blocks stand apart through spacing and light fills.','Numbers (weights, reps, timer, stats) use an easier-to-read font, titles keep their character.']},
    {t:'During a session', items:['Tap a rest time between two sets to adjust it in 15-second steps, without leaving the exercise. The rest before the next exercise works the same way.','The exercise header is lighter: only the exercise number remains.']},
    {t:'Import your data', items:['In Settings › Backup, “Import data (CSV)” reads the CSV file exported by your old training app.','Your imported sessions are added to your history: nothing is replaced, and sessions already there are skipped.','Each exercise in the file is linked to its Muscle 3000 match (you can correct it): your past feeds the ghost, progression and records right away.','Warm-ups, drop sets, notes and rest times come along. Weights in pounds are converted to kilos.','An import can be undone in one tap.']},
    {t:'French or English', items:['In Settings › Language, switch the whole app to English, and back to French whenever you like.','Everything follows: screens, exercise names, the morning message, the share card, the Excel spreadsheet, and even the drill sergeant.','Exercise search understands English names too.','Your data doesn\'t move: history, programs and notes stay the same in both languages.']}
  ]};
CHANGELOG.filter(function(c){ return c.v === '1.9'; })[0].en = {t:'The launch',
  summary:['Muscle 3000 is born: your programs, guided sessions and double progression that works out your weights.','Stats that motivate and a card to share at the end of a session.','A message every morning, tailored to your history.','Browse your history session by session.','Every exercise shows its movement in two pictures.'],
  sections:[
    {t:'The basics', items:['The Ascension program, ready to go.','Double progression works out your weight for every set, with your ghost from last time.','A big rest timer, swipe between exercises, warm-ups and a note per exercise.','4 colorways: Acid, Blaze, Ice and Night.']},
    {t:'Your programs', items:['Create your programs and sessions, with a day for each.','Reps, warm-ups and rest times can be set for each set.','Variants (squat or deadlift…) share the same note.','About 150 exercises sorted by muscle, with a search that finds as you type. Missing one? Create it in two seconds.']},
    {t:'Sessions that adapt', items:['Changed your session along the way? At the end, update the original session, or keep it as a new session in a program or in your free sessions.','Free sessions live outside programs, with no fixed day: start them from “Another session” on Home.','Improvise with “+ Empty session”: add exercises as you go, and decide at the end whether to keep it.','In a free session, swipe past the last exercise to add a new one.','You can remove an exercise during the session.']},
    {t:'Stats that motivate', items:['Tap a stat on Home to switch view: consistency, frequency, weekly volume, sessions or sets, progress over 6 weeks, 3 months or all time, totals for the month or the year. Your choice is remembered.','On Home: your weekly streak, your volume week by week and your biggest gains.','Three pie charts (zones, muscles, intensity): tap the center to move from one to the next.','A 12-week calendar so you never break the chain.']},
    {t:'Share your session', items:['At the end of a session, a story-format card, with or without your photo.','Your volume of the day turned into a real object: a Fiat 500, a T. rex, the great bell of Notre-Dame…']},
    {t:'The morning message', items:['The first time you open the app each day, it greets you based on your history: consistency, records, off days, a skipped session, forgotten legs or a long break.','With a stat just for you: what you lifted last time on today\'s session and what progression asks for, or a recap of your last session.','If a session is planned that day, start it straight from the message. You can see it again from Settings.']},
    {t:'Exercise sheets', items:['Each exercise shows its movement: a little figure in your theme colors, in start and end position.','Your history and records right below.']},
    {t:'Your history', items:['Tap a calendar day or a session in the list to see it again: duration, volume and every set.','Jump to the previous or next session with the two buttons at the top.','An exercise sheet opened from a session has a back button to return where you were.','The “Share as story” button rebuilds the share card for any session, with your photo for the last 5 shared sessions.']},
    {t:'Your data, safe', items:['Export all your data to a file, keep it wherever you like (email, Drive, notes), and restore it in one move.','A real formatted Excel workbook: a summary with your records, one line per session, and every set in detail.','A restore can be undone: your previous data is set aside.','A reminder if your last backup is more than a month old.']},
    {t:'No filter', items:['A switch in Settings hands the app over to a drill sergeant: buttons, titles, comments after each set and the morning message go full boot camp. Same info, zero mercy.']},
    {t:'And also', items:['The app has a name: Muscle 3000.','A badge flags every update in Settings.']}
  ]};
/* the changelog entry in the current language */
function clOf(c){ return isEN() && c.en ? {v:c.v, d:c.d, t:c.en.t, summary:c.en.summary, sections:c.en.sections} : c; }
function unreadLog(){ return (S.settings.seenLog || '') !== CHANGELOG[0].v; }
function vNews(){
  var h = restBar() + '<div class="top"><button data-a="scr" data-s="set">← RÉGLAGES</button><span>NOUVEAUTÉS</span></div>';
  h += '<div class="disp" style="font-size:52px">Carnet de bord</div>';
  h += '<div style="display:flex;flex-direction:column;gap:10px">';

function welcomeData(){
  var now = Date.now(), H = S.history;
  if(!H.length) return wmsg('first', {tag:'PREMIER JOUR', title:'Bienvenue', line:'Aucune séance au compteur. Tout le monde commence à zéro, même les monstres.'});
  var st = computeStats(), last = H[H.length - 1], gap = Math.floor((dayKey(now) - dayKey(last.date)) / DAYMS);
  var prs7 = 0; H.forEach(function(h){ if(now - h.date < 7 * DAYMS) prs7 += (h.prs || []).length; });
  var n14 = H.filter(function(h){ return now - h.date < 14 * DAYMS; }).length;
  /* how the last two séances went: share of work sets under the bottom of the range */
  var under = 0, tot = 0;
  H.slice(-2).forEach(function(h){ h.exercises.forEach(function(e){ e.sets.forEach(function(s){ if(s.warm || !s.lo) return; tot++; if(s.r < s.lo) under++; }); }); });
  var weak = tot >= 6 && under / tot >= 0.35;
  /* a planned séance skipped in the last 2 weeks while the others were done */
  var skipped = null, wids = workouts().map(function(w){ return w.id; });
  var nP = H.filter(function(h){ return wids.indexOf(h.pid) >= 0 && now - h.date < 15 * DAYMS; }).length;
  workouts().forEach(function(w){
    if(w.day == null || skipped) return;
    var due = 0, done = 0;
    for(var b = 1; b <= 14; b++){ if(new Date(now - b * DAYMS).getDay() === w.day) due++; }
    H.forEach(function(h){ if(h.pid === w.id && now - h.date < 15 * DAYMS) done++; });
    if(due >= 2 && done < due - 1 && nP >= 2) skipped = w;
  });
  /* an exercise going backwards: best set of the last time vs the time before */
  var slip = null;
  last.exercises.forEach(function(e){
    if(slip) return;

    var b0 = 0, b1 = 0;
    p[0].sets.forEach(function(s){ b0 = Math.max(b0, score(e.name, s.w, s.r)); });
    p[1].sets.forEach(function(s){ b1 = Math.max(b1, score(e.name, s.w, s.r)); });

  if(skipped) return wmsg('skip', {tag:skipped.name.toUpperCase() + ' ZAPPÉ', title:'On a vu ça', line:pickOf(['« ' + skipped.name + ' » t\'attendait. Il a cru à un lapin.','Tu fais toutes tes séances. Enfin, presque toutes. « ' + skipped.name + ' » te passe le bonjour.','« ' + skipped.name + ' » se demande ce qu\'il t\'a fait.'])}, {n:skipped.name});
  if(legless) return wmsg('legs', {tag:'HAUT ' + Math.round(up / Math.max(1, sp.total) * 100) + ' % · BAS ' + Math.round(low / Math.max(1, sp.total) * 100) + ' %', title:'Et les jambes ?', line:pickOf(['Haut du corps de déménageur, jambes de flamant rose. On rééquilibre ?','Tes cuisses ont demandé un syndicat.','Personne ne saute le leg day. Sauf toi, visiblement.'])}, {up:Math.round(up / Math.max(1, sp.total) * 100), low:Math.round(low / Math.max(1, sp.total) * 100)});

/* grid placement: 3 columns. Each widget keeps its square (c = column, r = row) in S.settings.widgets.
   m3wPack places them without overlap: a pinned widget (the one being dragged) takes its square first,
   then the others keep their spot if it is free, or flow into the first free spot that fits them. */
function m3wSpan(z){ return z === 'l' ? [2, 2] : z === 'm' ? [2, 1] : [1, 1]; }
function m3wPack(list, pin, flow){
  var occ = {}, out = [];
  function free(c, r, w, h){ if(c < 0 || r < 0 || c + w > 3) return false; for(var y = 0; y < h; y++) for(var x = 0; x < w; x++) if(occ[(r + y) * 3 + c + x]) return false; return true; }
  function take(i, c, r, w, h){ for(var y = 0; y < h; y++) for(var x = 0; x < w; x++) occ[(r + y) * 3 + c + x] = 1; out[i] = {c:c, r:r, w:w, h:h}; }
  function first(i, w, h){ for(var r = 0; r < 400; r++) for(var c = 0; c <= 3 - w; c++) if(free(c, r, w, h)){ take(i, c, r, w, h); return; } }
  var idx = list.map(function(w, i){ return i; }).filter(function(i){ return !pin || i !== pin.i; });
  /* reading order of the others (by their square, then by list order) */
  idx.sort(function(a, b){ var A = list[a], B = list[b], ra = A.r == null ? 1e6 : A.r, rb = B.r == null ? 1e6 : B.r; return ra - rb || (A.c || 0) - (B.c || 0) || a - b; });
  if(pin){ var ps = m3wSpan(list[pin.i].z); take(pin.i, Math.max(0, Math.min(3 - ps[0], pin.c)), Math.max(0, pin.r), ps[0], ps[1]); }
  if(!flow) idx = idx.filter(function(i){ var w = list[i], sp = m3wSpan(w.z); if(w.c != null && w.r != null && free(w.c, w.r, sp[0], sp[1])){ take(i, w.c, w.r, sp[0], sp[1]); return false; } return true; });
  idx.forEach(function(i){ var sp = m3wSpan(list[i].z); first(i, sp[0], sp[1]); });
  /* no empty row left between widgets */
  var used = {}; out.forEach(function(p){ for(var y = 0; y < p.h; y++) used[p.r + y] = 1; });
  var map = {}, n = 0, top = 0; out.forEach(function(p){ top = Math.max(top, p.r + p.h); });
  for(var r = 0; r < top; r++){ map[r] = n; if(used[r]) n++; }
  out.forEach(function(p){ p.r = map[p.r]; });
  return out;
}
function m3wPos(p){ return 'grid-column:' + (p.c + 1) + ' / span ' + p.w + ';grid-row:' + (p.r + 1) + ' / span ' + p.h; }

function m3wTile(w, i, c, preview, pos){

/* widgets: press and hold to lift one, then slide it anywhere; the others make room as it moves.
   A quick tap still opens the widget's settings. */
(function(){
  var g = null, suppress = false, HOLD = 380;
  function tiles(){ return Array.prototype.slice.call(document.querySelectorAll('.m3wg:not(.m3wg-prev) > .m3w')); }
  function cancel(){ if(!g) return; clearTimeout(g.timer); if(g.el) g.el.classList.remove('press'); g = null; }
  function place(){
    var r = g.base;
    g.el.style.transform = 'translate(' + (g.cx - g.offX - r.left) + 'px,' + (g.cy - g.offY - r.top) + 'px) scale(1.06)';
  }
  /* the square under the top-left corner of the held widget */
  function cell(){
    var gr = g.grid.getBoundingClientRect(), cs = getComputedStyle(g.grid), gap = parseFloat(cs.columnGap) || 7;
    var cw = (gr.width - 2 * gap) / 3, rh = parseFloat(cs.gridAutoRows) || cw;
    return {c:Math.round((g.cx - g.offX - gr.left) / (cw + gap)), r:Math.round((g.cy - g.offY - gr.top) / (rh + gap))};
  }
  /* lay every widget out again with the held one pinned on its square; the others slide to make room */
  function relayout(t){
    var list = g.list, els = tiles(), before = new Map(), held = g.el;
    var others = m3wPack(list.map(function(w, i){ return i === g.i ? {k:w.k, z:'s', c:w.c, r:w.r} : w; }).filter(function(w, i){ return i !== g.i; }), null, true);
    var rows = 0; others.forEach(function(p){ rows = Math.max(rows, p.r + p.h); });
    var pk = m3wPack(list, {i:g.i, c:t.c, r:Math.min(t.r, rows)}, true);
    els.forEach(function(el){ if(el !== held) before.set(el, el.getBoundingClientRect()); });
    els.forEach(function(el){ var i = +el.getAttribute('data-i'), p = pk[i]; if(p){ el.style.gridColumn = (p.c + 1) + ' / span ' + p.w; el.style.gridRow = (p.r + 1) + ' / span ' + p.h; } });
    before.forEach(function(a, el){
      var b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top; if(!dx && !dy) return;
      el.style.transition = 'none'; el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      el.getBoundingClientRect();
      el.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
    });
    g.pack = pk; held.style.transition = 'none'; held.style.transform = ''; g.base = held.getBoundingClientRect(); place();
  }
  function check(){
    if(!g || !g.lifted) return;
    var t = cell(), k = t.c + ',' + t.r; if(k === g.cellKey) return;
    g.cellKey = k; relayout(t);
  }

    var el = ev.target.closest && ev.target.closest('.m3wg:not(.m3wg-prev) > .m3w');

    var t = ev.touches[0], r = el.getBoundingClientRect();
    g = {el:el, i:+el.getAttribute('data-i'), x0:t.clientX, y0:t.clientY, cx:t.clientX, cy:t.clientY, offX:t.clientX - r.left, offY:t.clientY - r.top, lifted:false};
    el.classList.add('press');
    g.timer = setTimeout(function(){
      if(!g) return;
      g.lifted = true; g.ctx = m3wCtx(computeStats());
      g.grid = g.el.parentNode; g.list = m3wList(); g.cellKey = (g.list[g.i] || {}).c + ',' + (g.list[g.i] || {}).r;
      g.el.classList.remove('press'); g.el.classList.add('lifted');
      document.documentElement.classList.add('m3w-dragging');
      g.base = g.el.getBoundingClientRect(); g.el.style.transition = 'transform .16s ease-out'; place();
      try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
    }, HOLD);
  }, {passive:true});
  document.addEventListener('touchmove', function(ev){
    if(!g) return;
    var t = ev.touches[0];
    if(!g.lifted){ if(Math.abs(t.clientX - g.x0) > 8 || Math.abs(t.clientY - g.y0) > 8) cancel(); return; }
    ev.preventDefault();
    g.cx = t.clientX; g.cy = t.clientY; g.el.style.transition = 'none'; place();
    check();
  }, {passive:false});
  function drop(){

    if(!d.lifted){ d.el.classList.remove('press'); return; }

    document.documentElement.classList.remove('m3w-dragging');
    d.el.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)'; d.el.style.transform = '';

      d.el.classList.remove('lifted');
      /* keep the squares as they were on the screen, and the list in reading order */
      if(d.pack){ var list = m3wList(); list.forEach(function(w, i){ var p = d.pack[i]; if(p){ w.c = p.c; w.r = p.r; } }); list.sort(function(a, b){ return a.r - b.r || a.c - b.c; }); }

    }, 230);
  }
  document.addEventListener('touchend', drop);

  /* the tap that ends a drag must not open the widget settings */
  document.addEventListener('click', function(ev){ if(suppress && ev.target.closest && ev.target.closest('.m3w')){ ev.stopPropagation(); ev.preventDefault(); suppress = false; } }, true);
  document.addEventListener('contextmenu', function(ev){ if(ev.target.closest && ev.target.closest('.m3wg')) ev.preventDefault(); });
})();

/* bottom bar: fades and sinks gradually while scrolling down, comes back as soon as you scroll up,
   and is always fully there at the top and at the very bottom of the page */
(function(){
  var lastY = window.scrollY || 0, hide = 0, raf = 0, root = document.documentElement;
  function apply(){
    raf = 0;
    var y = window.scrollY || 0, dy = y - lastY, end = window.innerHeight + y >= root.scrollHeight - 6; lastY = y;
    if(y <= 24 || end) hide = 0; else hide = Math.max(0, Math.min(1, hide + dy / 110));
    root.style.setProperty('--navo', (1 - hide).toFixed(3));
    root.style.setProperty('--navy', (hide * 22).toFixed(1) + 'px');
    root.classList.toggle('nav-away', hide > 0.6);
  }
  window.addEventListener('scroll', function(){ if(!raf) raf = requestAnimationFrame(apply); }, {passive:true});
})();

/* ================= JOURNAL: month calendar + progress toward the month's planned sessions ================= */
function m3jCal(){
  var off = ui.calOff || 0, now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + off, 1);
  var y = base.getFullYear(), m = base.getMonth(), nDays = new Date(y, m + 1, 0).getDate(), today = dayKey(Date.now());
  var MN = L(['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'], ['January','February','March','April','May','June','July','August','September','October','November','December'])[m];
  var done = {}, vol = 0, prs = 0, n = 0, m0 = base.getTime(), m1 = new Date(y, m + 1, 1).getTime();
  S.history.forEach(function(h){ if(h.date >= m0 && h.date < m1){ var k = dayKey(h.date); (done[k] = done[k] || []).push(h); vol += sessVol(h); prs += (h.prs || []).length; n++; } });
  var plannedDays = {}; workouts().forEach(function(w){ if(w.day != null) plannedDays[w.day] = w; });
  var goal = 0, goalToDate = 0;
  for(var d = 1; d <= nDays; d++){ var dt = new Date(y, m, d); if(plannedDays[dt.getDay()]){ goal++; if(dayKey(dt.getTime()) <= today) goalToDate++; } }
  var cells = '', lead = (base.getDay() + 6) % 7;

  for(d = 1; d <= nDays; d++){
    var t = new Date(y, m, d), k = dayKey(t.getTime()), s = done[k], pl = plannedDays[t.getDay()], cls = 'm3c-d';
    if(s) cls += ' done' + (s.some(function(x){ return (x.prs || []).length; }) ? ' pr' : '');
    else if(pl && k > today) cls += ' plan';
    else if(pl && k < today) cls += ' miss';
    if(k === today) cls += ' now';
    cells += s ? '<button class="' + cls + '" data-a="day" data-k="' + k + '" aria-label="' + esc(fmtDate(k) + ' · ' + s.map(function(x){ return x.name; }).join(' + ')) + '"><b>' + d + '</b><small>' + esc(shortName(s[0].name)) + '</small></button>'

  }

  var note = !goal ? L('Place tes séances sur des jours dans Programme pour avoir un objectif.', 'Put your sessions on days in Program to get a goal.')

  if(off > 0) note = L('Mois à venir.', 'Upcoming month.');

  h += '<div class="m3c-head"><button data-a="jcal" data-d="-1" aria-label="' + L('Mois précédent', 'Previous month') + '">‹</button><div><span class="m3-eyebrow">' + y + '</span><b>' + MN + '</b></div><button data-a="jcal" data-d="1" aria-label="' + L('Mois suivant', 'Next month') + '"' + (off >= 1 ? ' disabled' : '') + '>›</button></div>';
  h += '<div class="m3c-prog"><div class="m3c-prog-top"><span>' + L('OBJECTIF DU MOIS', 'MONTHLY GOAL') + '</span><b>' + n + (goal ? ' / ' + goal : '') + ' ' + L('séance' + (n > 1 ? 's' : ''), 'session' + (n > 1 ? 's' : '')) + '</b></div>';
  h += '<div class="m3c-bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + n + '"><i style="width:' + pct + '%"></i>' + (goal && off === 0 && pace < 100 ? '<em style="left:' + pace + '%" title="' + L('Où tu devrais en être aujourd\'hui', 'Where you should be today') + '"></em>' : '') + '</div><small>' + note + '</small></div>';
  h += '<div class="m3c-grid">' + L(['L','M','M','J','V','S','D'], ['M','T','W','T','F','S','S']).map(function(x){ return '<span class="m3c-wd">' + x + '</span>'; }).join('') + cells + '</div>';
  h += '<div class="m3c-legend"><span><i class="lg-done"></i>' + L('Faite', 'Done') + '</span><span><i class="lg-pr"></i>' + L('Record', 'Record') + '</span><span><i class="lg-plan"></i>' + L('Prévue', 'Planned') + '</span><span><i class="lg-miss"></i>' + L('Manquée', 'Missed') + '</span></div>';

   From the top strip it always works; lower in the sheet, only once its content is scrolled to the top. */
(function(){
  var drag = null;
  function closeAll(){ ui.pad = null; ui.addPast = null; if(ui.hEdit) finishHistEdit(); ui.sheet = null; ui.picker = null; ui.daySheet = null; ui.ficheFrom = null; ui.newsDay = null; ui.storyId = null; ui.storyFrom = null; ui.wSheet = null; ui.confirm = null; render(); }
  function snapBack(d){ d.pane.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)'; d.pane.style.transform = ''; d.sheet.style.transition = 'background .24s'; d.sheet.style.background = ''; }
  document.addEventListener('touchstart', function(ev){
    drag = null;
    var pane = ev.target.closest && ev.target.closest('.sheet .pane'); if(!pane || ui.welcome) return;
    if(ev.target.closest('input,textarea,select,canvas')) return;
    var y = ev.touches[0].clientY, top = y - pane.getBoundingClientRect().top < 64;
    if(!top && pane.scrollTop > 0) return;
    drag = {pane:pane, sheet:pane.parentNode, y0:y, dy:0, t0:Date.now(), top:top, on:false};
  }, {passive:true});
  document.addEventListener('touchmove', function(ev){
    if(!drag) return;
    var dy = ev.touches[0].clientY - drag.y0;
    if(!drag.on){
      if(dy > 6 && (drag.top || drag.pane.scrollTop <= 0)){ drag.on = true; drag.y0 += 6; drag.t0 = Date.now(); drag.pane.style.transition = 'none'; drag.sheet.style.transition = 'none'; }
      else { if(Math.abs(dy) > 6) drag = null; return; }
    }
    ev.preventDefault();
    drag.dy = Math.max(0, ev.touches[0].clientY - drag.y0);
    drag.pane.style.transform = 'translateY(' + drag.dy + 'px)';
    drag.sheet.style.background = 'rgba(0,0,0,' + (0.55 * Math.max(0, 1 - drag.dy / (drag.pane.offsetHeight || 1))).toFixed(3) + ')';
  }, {passive:false});
  document.addEventListener('touchend', function(){
    if(!drag) return; var d = drag; drag = null; if(!d.on) return;
    var speed = d.dy / Math.max(1, Date.now() - d.t0);
    if(d.dy > Math.min(140, d.pane.offsetHeight * 0.3) || (speed > 0.5 && d.dy > 30)){
      d.pane.style.transition = 'transform .2s ease-out'; d.pane.style.transform = 'translateY(105%)';
      d.sheet.style.transition = 'background .2s'; d.sheet.style.background = 'rgba(0,0,0,0)';
      setTimeout(closeAll, 190);
    } else snapBack(d);
  });
  document.addEventListener('touchcancel', function(){ if(drag && drag.on) snapBack(drag); drag = null; });
})();

/* installe un programme de la bibliothèque (ou réactive celui déjà installé) et le rend actif */
function libInstall(id, days){
  var lp = libById(id); if(!lp) return null;
  var p = S.programs.filter(function(x){ return x.libId === id || (id === 'ascension' && x.id === 'zth'); })[0];
  if(!p){
    var src = JSON.parse(JSON.stringify(libWorkouts(lp)));
    p = {id:id === 'ascension' ? 'zth' : 'lib' + uid(), libId:id, name:lp.name, workouts:src.map(function(w){
      return {id:uid(), name:w.name, day:w.day, ex:w.ex.map(function(e){ var o = {name:e.name, r:e.r, rest:e.rest, cue:e.cue || ''}; if(e.v) o.v = e.v; normEx(o); return o; })};
    })};
    if(days && days.length === p.workouts.length){ var ds = days.slice().sort(function(a, b){ return ((a + 6) % 7) - ((b + 6) % 7); }); p.workouts.forEach(function(w, i){ w.day = ds[i]; }); }
    S.programs.push(p);
  }
  S.settings.activeProg = p.id; S.settings.cycleStart = S.settings.cycleStart || {}; S.settings.cycleStart[p.id] = Date.now();
  return p;
}
/* recommandation : jours, niveau, objectif et matériel, chacun pèse dans le score */
function libRank(a){
  return PROGLIB.map(function(lp){
    var s = 0;
    if(a.gear === 'home') s += lp.gear.indexOf('home') >= 0 ? 20 : -20;
    else if(lp.gear.indexOf('home') >= 0) s -= 20;
    if(a.gear === 'bar') s += lp.gear.indexOf('bar') >= 0 ? 4 : -6;
    if(a.gear === 'time') s += lp.gear.indexOf('time') >= 0 ? 6 : (lp.days <= 3 ? 0 : -4);
    s += lp.days === a.days ? 6 : Math.abs(lp.days - a.days) === 1 ? 2 : -3;
    s += lp.lv.indexOf(a.level) >= 0 ? 4 : -4;
    s += lp.goal[0] === a.goal ? 4 : lp.goal.indexOf(a.goal) >= 0 ? 2 : 0;
    if(lp.id === 'ascension' && a.level !== 'deb') s += 1;
    return {lp:lp, s:s};
  }).sort(function(x, y){ return y.s - x.s; }).map(function(x){ return x.lp; });
}
